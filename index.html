<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where shall we go? · Saint-Genis Trip Picker</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="">
</head>
<body>
<header class="hero">
  <div class="lang-toggle">
    <button data-lang="zh" class="active">中文</button>
    <button data-lang="en">English</button>
  </div>
  <h1 data-i18n="title">感謝你來瑞士找我玩 💖</h1>
  <p class="subtitle" data-i18n="subtitle">挑幾個你想去的地方，我來安排</p>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="day" data-i18n="tabDay">🌅 當天來回</button>
  <button class="tab" data-tab="overnight" data-i18n="tabOvernight">🌙 過夜行程</button>
  <button class="tab" data-tab="map" data-i18n="tabMap">🗺 地圖</button>
  <button class="tab" data-tab="packing" data-i18n="tabPacking">🎒 行李清單</button>
  <button class="tab" data-tab="picks" data-i18n="tabPicks">💌 我的清單 <span id="pickCount" class="count">0</span></button>
</nav>

<main>
  <div id="sort-bar" class="sort-bar">
    <span class="sort-label" data-i18n="sortBy">排序</span>
    <button class="sort-btn active" data-sort="score" data-i18n="sortScore">分數 高→低</button>
    <button class="sort-btn" data-sort="time" data-i18n="sortTime">交通時間 短→長</button>
  </div>
  <section id="day-section" class="cards"></section>
  <section id="overnight-section" class="cards hidden"></section>
  <section id="packing-section" class="packing hidden">
    <h2 data-i18n="packingTitle">9 天打包清單</h2>
    <p class="packing-sub" data-i18n="packingSub">勾起來代表已準備（自動儲存）</p>
    <div class="packing-progress-bar">
      <div class="bar-track"><div id="packing-bar-fill" class="bar-fill"></div></div>
      <span id="packing-progress-text"></span>
      <button id="packing-reset" class="reset-btn" data-i18n="resetAll">重置全部</button>
    </div>
    <div id="packing-list"></div>
  </section>
  <section id="map-section" class="hidden">
    <div class="map-legend">
      <span><span class="dot home"></span><span data-i18n="mapHome">家</span></span>
      <span><span class="dot day"></span><span data-i18n="mapDay">當天來回</span></span>
      <span><span class="dot over"></span><span data-i18n="mapOver">過夜</span></span>
    </div>
    <div id="map"></div>
  </section>
  <section id="picks-section" class="picks hidden">
    <h2 data-i18n="picksTitle">你選的地方</h2>
    <div id="from-friend-banner" class="from-friend hidden"></div>
    <div id="trip-days-control" class="trip-days-control hidden">
      <label for="total-days-input" data-i18n="totalDays">總行程天數</label>
      <input id="total-days-input" type="number" min="1" max="14" value="7">
      <span class="multi-hint" data-i18n="multiHint">（過夜可複選）</span>
    </div>
    <div id="picks-list"></div>
    <p id="picks-empty" data-i18n="picksEmpty">還沒選任何地方，去逛逛吧～</p>
    <div id="friend-message-display" class="friend-message-display hidden"></div>
    <div id="message-box" class="message-box hidden">
      <label for="friend-message" data-i18n="msgLabel">💌 送給徐振華的話（選填）</label>
      <textarea id="friend-message" rows="3" data-i18n-placeholder="msgPlaceholder"
                placeholder="可以寫下期待、想說的話、最興奮的景點… ✨"></textarea>
    </div>
    <div id="send-box" class="send-box hidden">
      <h3 data-i18n="sendTitle">把選擇送給 Ken</h3>
      <p class="send-hint" data-i18n="sendHint">選好後挑一個方式傳給我</p>
      <div class="send-buttons">
        <button id="btn-copy"  data-i18n="btnCopy">📋 複製文字</button>
        <button id="btn-link"  data-i18n="btnLink">🔗 複製分享連結</button>
        <button id="btn-email" data-i18n="btnEmail">✉️ 用 Email 寄</button>
        <button id="btn-wa"    data-i18n="btnWa">💬 用 WhatsApp 傳</button>
      </div>
      <p id="send-toast" class="toast"></p>
    </div>
  </section>
</main>

<footer>
  <p data-i18n="footer">用愛 + GitHub Pages 製作 ♡</p>
</footer>

<button id="music-toggle" class="music-btn" aria-label="Toggle music" title="背景音樂">🎵</button>
<audio id="bg-audio" src="music/bg.mp3" loop preload="none"></audio>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
<script src="data.js"></script>
<script src="packing.js"></script>
<script src="app.js"></script>
</body>
</html>
